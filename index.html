<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marriage Council Assessment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ REPLACE WITH YOUR FIREBASE CONFIG KEYS FROM STEP 1 ⚠️
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const PROFILES = [
      { id: "u1", name: "Timothy", role: "Best Man", spouseId: "u2", spouseName: "Ciku" },
      { id: "u2", name: "Ciku", role: "Maid of Honor", spouseId: "u1", spouseName: "Timothy" },
      { id: "u3", name: "Mugo", role: "Groom", spouseId: "u4", spouseName: "Christine" },
      { id: "u4", name: "Christine", role: "Bride", spouseId: "u3", spouseName: "Mugo" }
    ];

    function App() {
      const [view, setView] = React.useState("select_user");
      const [currentUser, setCurrentUser] = React.useState(null);
      const [stage, setStage] = React.useState(1);
      const [answers, setAnswers] = React.useState({});
      const [allResponses, setAllResponses] = React.useState([]);
      const [questions, setQuestions] = React.useState([]);

      React.useEffect(() => {
        const unsubResponses = onSnapshot(collection(db, "responses"), (snapshot) => {
          setAllResponses(snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() })));
        });
        const unsubQuestions = onSnapshot(collection(db, "questions"), (snapshot) => {
          setQuestions(snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() })));
        });
        return () => { unsubResponses(); unsubQuestions(); };
      }, []);

      if (view === "select_user") {
        return (
          <div className="p-6 max-w-md mx-auto text-center space-y-6 pt-16">
            <h1 className="text-3xl font-extrabold text-blue-400">Marriage Council</h1>
            <p className="text-slate-400">Select your profile to start:</p>
            <div className="space-y-3">
              {PROFILES.map((p) => (
                <button
                  key={p.id}
                  onClick={() => { setCurrentUser(p); setView("quiz"); }}
                  className="w-full p-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-left flex justify-between items-center"
                >
                  <div>
                    <div className="font-bold text-lg">{p.name}</div>
                    <div className="text-xs text-slate-400">{p.role}</div>
                  </div>
                  <span className="text-blue-400 text-sm font-semibold">Select →</span>
                </button>
              ))}
            </div>
            <button 
              onClick={() => setView("dashboard")}
              className="mt-6 text-xs text-slate-500 underline hover:text-slate-300"
            >
              Open Best Man Dashboard
            </button>
          </div>
        );
      }

      if (view === "dashboard") {
        return (
          <div className="p-6 max-w-4xl mx-auto space-y-6">
            <div className="flex justify-between items-center border-b border-slate-700 pb-4">
              <h1 className="text-2xl font-bold text-blue-400">Best Man Dashboard</h1>
              <button onClick={() => setView("select_user")} className="px-3 py-1 bg-slate-800 text-xs rounded border border-slate-700">Exit</button>
            </div>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              {PROFILES.map((p) => {
                const s1 = allResponses.some((r) => r.userId === p.id && r.stage === 1);
                const s2 = allResponses.some((r) => r.userId === p.id && r.stage === 2);
                return (
                  <div key={p.id} className="p-4 bg-slate-800 rounded-xl border border-slate-700 space-y-2">
                    <h3 className="font-bold text-white">{p.name}</h3>
                    <p className="text-xs text-slate-400">Stage 1: {s1 ? "✅ Done" : "⏳ Pending"}</p>
                    <p className="text-xs text-slate-400">Stage 2: {s2 ? "✅ Done" : "⏳ Pending"}</p>
                    <button 
                      onClick={async () => {
                        if (confirm(`Reset ${p.name}?`)) {
                          await deleteDoc(doc(db, "responses", `${p.id}_stage1`));
                          await deleteDoc(doc(db, "responses", `${p.id}_stage2`));
                        }
                      }}
                      className="w-full mt-2 py-1 bg-rose-900/40 text-rose-300 border border-rose-800 rounded text-xs"
                    >
                      Reset
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      return <div className="p-6 text-center text-slate-400">Loading or Quiz View Active...</div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
