    function App() {
      const [view, setView] = React.useState("select_user");
      const [currentUser, setCurrentUser] = React.useState(null);
      const [activeSessionId, setActiveSessionId] = React.useState(1);
      const [stage, setStage] = React.useState(1);
      const [questions, setQuestions] = React.useState([]);
      const [currentQIndex, setCurrentQIndex] = React.useState(0);
      const [answers, setAnswers] = React.useState({});
      const [allResponses, setAllResponses] = React.useState([]);
      const [isSubmitted, setIsSubmitted] = React.useState(false);
      const [selectedCouplePrint, setSelectedCouplePrint] = React.useState("u3_u4"); // Default Groom/Bride

      React.useEffect(() => {
        const unsubResponses = onSnapshot(collection(db, "responses"), (snapshot) => {
          setAllResponses(snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() })));
        });

        const unsubQuestions = onSnapshot(collection(db, "questions"), async (snapshot) => {
          const qData = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
          if (qData.length === 0) {
            await seedQuestions();
          } else {
            setQuestions(qData);
          }
        });

        return () => { unsubResponses(); unsubQuestions(); };
      }, []);

      const seedQuestions = async () => {
        for (const q of DEFAULT_QUESTIONS) {
          await setDoc(doc(db, "questions", q.id), q);
        }
      };

      const sessionQuestions = questions
        .filter((q) => q.sessionId === activeSessionId)
        .sort((a,b) => a.id.localeCompare(b.id, undefined, {numeric: true}));

      const handleSelectOption = (key) => {
        if (!sessionQuestions[currentQIndex]) return;
        setAnswers({ ...answers, [sessionQuestions[currentQIndex].id]: key });
      };

      const handleNextQuestion = async () => {
        const docId = `${currentUser.id}_s${activeSessionId}_stage${stage}`;
        
        setDoc(doc(db, "responses", docId), {
          userId: currentUser.id,
          userName: currentUser.name,
          sessionId: activeSessionId,
          stage: stage,
          answers: answers,
          updatedAt: new Date().toISOString()
        }, { merge: true }).catch(e => console.error(e));

        if (currentQIndex < sessionQuestions.length - 1) {
          setCurrentQIndex(prev => prev + 1);
        } else {
          if (stage === 1) {
            setStage(2);
            setCurrentQIndex(0);
            setAnswers({});
          } else {
            setIsSubmitted(true);
          }
        }
      };

      // SELECT USER SCREEN
      if (view === "select_user") {
        return (
          <div className="p-6 max-w-xl mx-auto text-center space-y-6 pt-10">
            <div>
              <h1 className="text-3xl font-extrabold text-blue-400">Marriage Council</h1>
              <p className="text-slate-400 text-sm mt-1">4-Session Pre-Marital Mentorship Engine</p>
            </div>

            <div className="p-4 bg-slate-800/80 rounded-xl border border-slate-700 text-left space-y-2">
              <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block">1. Choose Mentorship Session:</label>
              <select 
                value={activeSessionId} 
                onChange={(e) => setActiveSessionId(Number(e.target.value))}
                className="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white font-semibold focus:border-blue-500 focus:outline-none"
              >
                {SESSIONS.map((s) => (
                  <option key={s.id} value={s.id}>{s.title}</option>
                ))}
              </select>
            </div>

            <div className="space-y-3 text-left">
              <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block">2. Select Your Profile:</label>
              {PROFILES.map((p) => (
                <button
                  key={p.id}
                  onClick={() => { 
                    setCurrentUser(p); 
                    setView("quiz"); 
                    setStage(1); 
                    setCurrentQIndex(0); 
                    setAnswers({}); 
                    setIsSubmitted(false); 
                  }}
                  className="w-full p-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-left flex justify-between items-center transition group"
                >
                  <div>
                    <div className="font-bold text-lg text-white group-hover:text-blue-300 transition">{p.name}</div>
                    <div className="text-xs text-slate-400">{p.role} • Partner: {p.spouseName}</div>
                  </div>
                  <span className="text-blue-400 text-sm font-semibold">Start Session {activeSessionId} →</span>
                </button>
              ))}
            </div>

            <div className="pt-6 border-t border-slate-800 flex justify-between items-center text-xs">
              <button 
                onClick={() => setView("dashboard")}
                className="text-slate-400 underline hover:text-white font-medium"
              >
                Open Best Man Dashboard
              </button>
              <button 
                onClick={() => setView("print_summary")}
                className="text-blue-400 underline hover:text-blue-300 font-medium"
              >
                Printable Summaries
              </button>
            </div>
          </div>
        );
      }

      // BEST MAN DASHBOARD SCREEN
      if (view === "dashboard") {
        const currentSessionInfo = SESSIONS.find(s => s.id === activeSessionId);

        return (
          <div className="p-6 max-w-5xl mx-auto space-y-6 no-print">
            <div className="flex flex-col md:flex-row justify-between md:items-center border-b border-slate-700 pb-4 gap-4">
              <div>
                <h1 className="text-2xl font-bold text-blue-400">Best Man Dashboard</h1>
                <p className="text-xs text-slate-400">Live Assessment Analytics & Discussion Guide</p>
              </div>

              <div className="flex items-center gap-3">
                <select 
                  value={activeSessionId} 
                  onChange={(e) => setActiveSessionId(Number(e.target.value))}
                  className="p-2 bg-slate-800 border border-slate-700 rounded-lg text-xs font-bold text-blue-300 focus:outline-none"
                >
                  {SESSIONS.map((s) => (
                    <option key={s.id} value={s.id}>Session {s.id}: {s.title.split(':')[1]}</option>
                  ))}
                </select>

                <button onClick={() => setView("print_summary")} className="px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-lg transition">Print Summaries</button>
                <button onClick={() => setView("select_user")} className="px-3 py-2 bg-slate-800 text-xs rounded-lg border border-slate-700 hover:bg-slate-700">Exit</button>
              </div>
            </div>

            {/* Profile Overview Cards */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {PROFILES.map((p) => {
                const s1 = allResponses.find((r) => r.userId === p.id && r.sessionId === activeSessionId && r.stage === 1);
                const s2 = allResponses.find((r) => r.userId === p.id && r.sessionId === activeSessionId && r.stage === 2);
                const spouseResp = allResponses.find((r) => r.userId === p.spouseId && r.sessionId === activeSessionId && r.stage === 1);
                
                let score = null;
                if (s2 && spouseResp) {
                  let matches = 0;
                  let total = 0;
                  Object.keys(s2.answers).forEach((qId) => {
                    if (spouseResp.answers[qId]) {
                      total++;
                      if (s2.answers[qId] === spouseResp.answers[qId]) matches++;
                    }
                  });
                  if (total > 0) score = Math.round((matches / total) * 100);
                }

                return (
                  <div key={p.id} className="p-5 bg-slate-800 rounded-xl border border-slate-700 space-y-3">
                    <div className="flex justify-between items-start">
                      <div>
                        <h3 className="font-bold text-lg text-white">{p.name} <span className="text-xs text-slate-400">({p.role})</span></h3>
                        <p className="text-xs text-slate-400">Partner: {p.spouseName}</p>
                      </div>
                      {score !== null && (
                        <div className="text-right">
                          <div className={`text-xl font-black ${score >= 70 ? 'text-emerald-400' : score >= 40 ? 'text-amber-400' : 'text-rose-400'}`}>{score}%</div>
                          <div className="text-[10px] text-slate-400">Prediction Accuracy</div>
                        </div>
                      )}
                    </div>

                    <div className="space-y-1 text-xs">
                      <div className="flex justify-between">
                        <span>Stage 1 (Self Assessment):</span>
                        <span className={s1 ? "text-emerald-400 font-bold" : "text-amber-400"}>{s1 ? "✅ Complete" : "⏳ Pending"}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>Stage 2 (Predict {p.spouseName}):</span>
                        <span className={s2 ? "text-emerald-400 font-bold" : "text-amber-400"}>{s2 ? "✅ Complete" : "⏳ Pending"}</span>
                      </div>
                    </div>

                    <button 
                      onClick={async () => {
                        if (confirm(`Reset Session ${activeSessionId} responses for ${p.name}?`)) {
                          await deleteDoc(doc(db, "responses", `${p.id}_s${activeSessionId}_stage1`));
                          await deleteDoc(doc(db, "responses", `${p.id}_s${activeSessionId}_stage2`));
                        }
                      }}
                      className="w-full mt-2 py-1 bg-rose-900/30 text-rose-300 hover:bg-rose-900/50 border border-rose-800 rounded text-xs transition"
                    >
                      Reset Session {activeSessionId} Progress
                    </button>
                  </div>
                );
              })}
            </div>

            {/* MISMATCH & DISCUSSION GUIDE ENGINE */}
            <div className="p-5 bg-slate-800 rounded-xl border border-slate-700 space-y-4">
              <h2 className="text-lg font-bold text-blue-300">Session {activeSessionId} - Interactive Discussion & Mismatch Guide</h2>
              <p className="text-xs text-slate-400">This guide auto-detects where couples predicted incorrectly about each other for Session {activeSessionId}.</p>

              {["u3_u4", "u1_u2"].map((pairKey) => {
                const [p1Id, p2Id] = pairKey.split("_");
                const p1 = PROFILES.find(p => p.id === p1Id);
                const p2 = PROFILES.find(p => p.id === p2Id);

                const p1_s1 = allResponses.find(r => r.userId === p1.id && r.sessionId === activeSessionId && r.stage === 1);
                const p1_s2 = allResponses.find(r => r.userId === p1.id && r.sessionId === activeSessionId && r.stage === 2);
                const p2_s1 = allResponses.find(r => r.userId === p2.id && r.sessionId === activeSessionId && r.stage === 1);
                const p2_s2 = allResponses.find(r => r.userId === p2.id && r.sessionId === activeSessionId && r.stage === 2);

                const sessQs = questions.filter(q => q.sessionId === activeSessionId);

                return (
                  <div key={pairKey} className="space-y-3 pt-3 border-t border-slate-700">
                    <h3 className="font-bold text-white text-md flex items-center gap-2">
                      <span>👩‍❤️‍👨 Couple: {p1.name} & {p2.name}</span>
                    </h3>

                    {(!p1_s1 || !p2_s1) ? (
                      <p className="text-xs text-amber-400 italic">Both partners must complete Stage 1 to unlock mismatch analysis.</p>
                    ) : (
                      <div className="space-y-3">
                        {sessQs.map((q) => {
                          const p1Self = p1_s1?.answers[q.id];
                          const p2Self = p2_s2 ? p2_s1?.answers[q.id] : p2_s1?.answers[q.id];
                          const p1PredP2 = p1_s2?.answers[q.id];
                          const p2PredP1 = p2_s2?.answers[q.id];

                          const p1PredCorrect = p1PredP2 && p1PredP2 === p2Self;
                          const p2PredCorrect = p2PredP1 && p2PredP1 === p1Self;
                          const directSelfMatch = p1Self && p2Self && p1Self === p2Self;

                          const opt1 = q.options.find(o => o.key === p1Self)?.label;
                          const opt2 = q.options.find(o => o.key === p2Self)?.label;

                          return (
                            <div key={q.id} className="p-3 bg-slate-900/90 rounded-lg border border-slate-750 text-xs space-y-2">
                              <div className="flex justify-between font-semibold text-blue-400">
                                <span>{q.category}: {q.text}</span>
                                {directSelfMatch ? (
                                  <span className="text-emerald-400 font-bold bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800">Perfect Self-Alignment</span>
                                ) : (
                                  <span className="text-amber-400 font-bold bg-amber-950/60 px-2 py-0.5 rounded border border-amber-800">Differing Perspectives</span>
                                )}
                              </div>

                              <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-slate-300 pt-1">
                                <div className="p-2 bg-slate-800/60 rounded">
                                  <div className="font-bold text-white">{p1.name}'s Choice: <span className="text-blue-300">{p1Self || "N/A"}</span></div>
                                  <div className="text-[11px] text-slate-400">{opt1}</div>
                                  {p2PredP1 && (
                                    <div className={`mt-1 text-[10px] font-semibold ${p2PredCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>
                                      {p2.name} predicted: {p2PredP1} ({p2PredCorrect ? 'Correct' : 'Incorrect'})
                                    </div>
                                  )}
                                </div>

                                <div className="p-2 bg-slate-800/60 rounded">
                                  <div className="font-bold text-white">{p2.name}'s Choice: <span className="text-blue-300">{p2Self || "N/A"}</span></div>
                                  <div className="text-[11px] text-slate-400">{opt2}</div>
                                  {p1PredP2 && (
                                    <div className={`mt-1 text-[10px] font-semibold ${p1PredCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>
                                      {p1.name} predicted: {p1PredP2} ({p1PredCorrect ? 'Correct' : 'Incorrect'})
                                    </div>
                                  )}
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* ADMIN TOOLS */}
            <div className="p-4 bg-slate-800/50 rounded-xl border border-slate-700 flex justify-between items-center text-xs">
              <span className="text-slate-400 font-semibold">Admin Tools:</span>
              <button 
                onClick={async () => {
                  if (confirm("Re-seed default questions into database? This preserves responses.")) {
                    await seedQuestions();
                    alert("Database questions updated successfully!");
                  }
                }}
                className="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-white font-medium"
              >
                Reset/Seed Default Questions
              </button>
            </div>
          </div>
        );
      }

      // PRINTABLE SUMMARY SHEET SCREEN
      if (view === "print_summary") {
        const [p1Id, p2Id] = selectedCouplePrint.split("_");
        const p1 = PROFILES.find(p => p.id === p1Id);
        const p2 = PROFILES.find(p => p.id === p2Id);

        return (
          <div className="p-6 max-w-4xl mx-auto space-y-6">
            <div className="no-print flex justify-between items-center border-b border-slate-700 pb-4">
              <div>
                <h1 className="text-xl font-bold text-blue-400">Printable Mentorship Summary</h1>
                <p className="text-xs text-slate-400">Generate clean report cards for live counseling sessions.</p>
              </div>

              <div className="flex gap-2">
                <select 
                  value={selectedCouplePrint} 
                  onChange={(e) => setSelectedCouplePrint(e.target.value)}
                  className="p-2 bg-slate-800 border border-slate-700 rounded text-xs font-bold text-white"
                >
                  <option value="u3_u4">Groom & Bride (Mugo & Christine)</option>
                  <option value="u1_u2">Best Man & MOH (Timothy & Ciku)</option>
                </select>
                <button onClick={() => window.print()} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded text-xs">🖨 Print / Export PDF</button>
                <button onClick={() => setView("select_user")} className="px-3 py-2 bg-slate-800 text-xs rounded border border-slate-700">Back</button>
              </div>
            </div>

            {/* PRINT PAGE AREA */}
            <div className="print-page p-8 bg-slate-800 rounded-xl border border-slate-700 space-y-6 text-slate-100">
              <div className="border-b border-slate-600 pb-4 text-center space-y-1">
                <h1 className="text-2xl font-black uppercase tracking-wider text-blue-400">Marriage Council Summary Report</h1>
                <p className="text-sm font-semibold">Couple: {p1.name} ({p1.role}) & {p2.name} ({p2.role})</p>
                <p className="text-xs text-slate-400">Generated on: {new Date().toLocaleDateString()}</p>
              </div>

              {SESSIONS.map((sess) => {
                const sessQs = questions.filter(q => q.sessionId === sess.id);
                const p1_s1 = allResponses.find(r => r.userId === p1.id && r.sessionId === sess.id && r.stage === 1);
                const p2_s1 = allResponses.find(r => r.userId === p2.id && r.sessionId === sess.id && r.stage === 1);

                return (
                  <div key={sess.id} className="space-y-3 print-card p-4 bg-slate-800/40 rounded-lg border border-slate-700">
                    <h2 className="text-base font-bold text-blue-300 border-b border-slate-700 pb-1">{sess.title}</h2>
                    
                    <div className="space-y-2 text-xs">
                      {sessQs.map((q) => {
                        const a1 = p1_s1?.answers[q.id];
                        const a2 = p2_s1?.answers[q.id];
                        const match = a1 && a2 && a1 === a2;

                        const opt1 = q.options.find(o => o.key === a1)?.label;
                        const opt2 = q.options.find(o => o.key === a2)?.label;

                        return (
                          <div key={q.id} className="p-2 bg-slate-900/60 rounded border border-slate-800">
                            <div className="font-semibold flex justify-between text-slate-200">
                              <span>{q.category}: {q.text}</span>
                              <span className={match ? "text-emerald-400 font-bold" : "text-amber-400 font-bold"}>
                                {match ? "Aligned" : "Different"}
                              </span>
                            </div>
                            <div className="grid grid-cols-2 gap-2 mt-1 text-[11px] text-slate-400">
                              <div><strong>{p1.name}:</strong> ({a1 || "N/A"}) {opt1 || "Not answered"}</div>
                              <div><strong>{p2.name}:</strong> ({a2 || "N/A"}) {opt2 || "Not answered"}</div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      // SUBMITTED CONFIRMATION SCREEN
      if (isSubmitted) {
        return (
          <div className="p-6 max-w-md mx-auto text-center space-y-6 pt-20">
            <div className="text-5xl">🎉</div>
            <h2 className="text-2xl font-bold text-emerald-400">Session {activeSessionId} Complete, {currentUser.name}!</h2>
            <p className="text-slate-300 text-sm">You have completed both Stage 1 and Stage 2 for {SESSIONS.find(s=>s.id===activeSessionId)?.title}.</p>
            <div className="space-y-2 pt-4">
              <button 
                onClick={() => setView("select_user")}
                className="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-sm transition"
              >
                Return to Session Selection
              </button>
              <button 
                onClick={() => setView("dashboard")}
                className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-sm border border-slate-700 transition"
              >
                Open Best Man Dashboard
              </button>
            </div>
          </div>
        );
      }

      if (sessionQuestions.length === 0) {
        return <div className="p-12 text-center text-slate-400 animate-pulse">Loading Session {activeSessionId} questions...</div>;
      }

      const currentQ = sessionQuestions[currentQIndex];

      // MAIN QUIZ ASSESSOR SCREEN
      return (
        <div className="p-6 max-w-md mx-auto space-y-6 pt-6">
          <div className="flex justify-between items-center text-xs text-slate-400 border-b border-slate-800 pb-3">
            <div>
              User: <strong className="text-white">{currentUser.name}</strong>
              <div className="text-[10px] text-blue-400">Session {activeSessionId}</div>
            </div>
            <span className="px-2 py-1 bg-slate-800 rounded border border-slate-700 text-blue-300 font-semibold">
              {stage === 1 ? "Stage 1: Your Answer" : `Stage 2: Predict ${currentUser.spouseName}`}
            </span>
          </div>

          <div className="space-y-1">
            <div className="text-xs text-blue-400 font-semibold uppercase tracking-wider">{currentQ.category}</div>
            <div className="flex justify-between text-xs text-slate-500">
              <span>Question {currentQIndex + 1} of {sessionQuestions.length}</span>
            </div>
          </div>

          <h2 className="text-lg font-bold text-white leading-snug">{currentQ.text}</h2>

          <div className="space-y-3 pt-2">
            {currentQ.options.map((opt) => {
              const selected = answers[currentQ.id] === opt.key;
              return (
                <button
                  key={opt.key}
                  onClick={() => handleSelectOption(opt.key)}
                  className={`w-full p-4 text-left rounded-xl border text-sm transition ${
                    selected 
                      ? "bg-blue-600/20 border-blue-500 text-white font-semibold" 
                      : "bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-750"
                  }`}
                >
                  <span className="inline-block w-6 font-bold text-blue-400">{opt.key}.</span> {opt.label}
                </button>
              );
            })}
          </div>

          <button
            disabled={!answers[currentQ.id]}
            onClick={handleNextQuestion}
            className={`w-full py-4 rounded-xl font-bold text-sm transition ${
              answers[currentQ.id]
                ? "bg-blue-600 hover:bg-blue-500 text-white"
                : "bg-slate-800 text-slate-500 cursor-not-allowed"
            }`}
          >
            {currentQIndex === sessionQuestions.length - 1 
              ? (stage === 1 ? `Complete Stage 1 & Move to Predict ${currentUser.spouseName} →` : `Submit Session ${activeSessionId} Assessment ✔`) 
              : "Next Question →"}
          </button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
  </html>
